<!DOCTYPE html>
<html>
<head>
    <!-- Resolve the colour theme before first paint to avoid a flash.
         Uses the visitor's saved choice, else falls back to the OS setting. -->
    <script>
      (function () {
        var el = document.documentElement;
        el.classList.add('js');
        try {
          var saved = localStorage.getItem('theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          el.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.excerpt }}" />
    <meta name="keywords" content="ruby, rails, python, java, javascript, go, lua, clojure, erlang, elixir, software development, software engineering, vim, docker, deis, robotics, electronics, ai, faas, serverless, devops, peopleops" />
    <meta name="robots" content="index, follow" />

    <meta name="HandheldFriendly" content="True" />
    <meta name="MobileOptimized" content="320" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Facebook OpenGraph Tags -->
    <meta property="og:url"         content="{{ site.url }}{{ page.url }}" />
    <meta property="og:type"        content="article" />
    <meta property="og:title"       content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.excerpt }}" />
    <meta property="og:site_name"   content="{{ site.description }}" />
    <meta property="og:image"       content="" />


    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@{{ site.twitter.username }}" />
    <meta name="twitter:title" content="{{ page.title }}" />
    <meta name="twitter:description" content="{{ page.excerpt }}" />
    <meta name="twitter:image" content="" />

    <link rel="stylesheet" type="text/css" href="/assets/css/screen.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" />

    <!-- Customization  -->
    <link rel="stylesheet" type="text/css" href="/assets/css/main.css" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="https://feeds.feedburner.com/rpanachi">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon"/>

    {{ seo }}
</head>
<body class="{% if page.post_class %}{{page.post_class}}{% else %}home-template{% endif %}">

    {{ content }}

    <footer class="site-footer clearfix">
      <section class="copyright">
        <a href="{{ site.baseurl }}">{{ site.author }}</a> &copy;
              {{ "now" | date: "%Y" }} &bull; All rights reserved. 
      </section>
      <section class="poweredby">Made with Jekyll using 
        <a href="https://github.com/rosario/kasper">Kasper theme</a>
      </section>
    </footer>

    <!-- Header light/dark toggle -->
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var el = document.documentElement;
          var next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          el.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
        });
      })();
    </script>

    <script type="text/javascript" src="/assets/js/jquery-1.11.1.min.js"></script>
    <script type="text/javascript" src="/assets/js/jquery.fitvids.js"></script>
    <script type="text/javascript" src="/assets/js/index.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '{{ site.google_analytics }}');
    </script>
</body>
</html>
